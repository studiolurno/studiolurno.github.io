<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Selo e Monograma Oficial Brasa Nobre Burger">
  <defs>
    <style>
      .bn-s-mono { font-family: 'Oswald', 'Bahnschrift Condensed', 'Arial Narrow', sans-serif; font-weight: 700; letter-spacing: 0.08em; }
      .bn-s-ring { font-family: 'JetBrains Mono', 'Consolas', monospace; font-weight: 700; letter-spacing: 0.16em; }
    </style>
    <!-- Arco superior (esquerda -> direita por cima) -->
    <path id="bnTopArc" d="M 32,100 A 68,68 0 1,1 168,100"/>
    <!-- Arco inferior (esquerda -> direita por baixo, leitura normal) -->
    <path id="bnBotArc" d="M 24,104 A 76,76 0 0,0 176,104"/>
  </defs>
  <!-- Base Carvão Profundo + Anéis Dourado/Bronze -->
  <circle cx="100" cy="100" r="95" fill="#12100E" stroke="#D4A373" stroke-width="2.4"/>
  <circle cx="100" cy="100" r="87" fill="none" stroke="#3D322C" stroke-width="1.2" stroke-dasharray="4 3"/>
  <circle cx="100" cy="100" r="54" fill="#1C1917" stroke="#3D322C" stroke-width="1.5"/>

  <!-- Texto circular superior e inferior legíveis -->
  <text fill="#F4EFEA" font-size="11" class="bn-s-ring">
    <textPath href="#bnTopArc" startOffset="50%" text-anchor="middle">BRASA NOBRE BURGER</textPath>
  </text>
  <text fill="#D4A373" font-size="9.5" class="bn-s-ring">
    <textPath href="#bnBotArc" startOffset="50%" text-anchor="middle">PARRILLA • DEFUMADOS</textPath>
  </text>

  <!-- Losangos laterais -->
  <polygon points="22,100 26,96 30,100 26,104" fill="#E85D04"/>
  <polygon points="170,100 174,96 178,100 174,104" fill="#E85D04"/>

  <!-- Chama minimalista superior -->
  <path d="M100 54 C100 54 111 65 111 74 C111 79.8 106.2 83.8 100 83.8 C93.8 83.8 89 79.8 89 74 C89 68.8 92.8 64.5 94.2 60.5 C95.6 63 97.2 63.8 97.2 63.8 C96.5 59.8 100 54 100 54 Z" fill="#E85D04"/>
  <polygon points="100,66 104,74 100,79.2 96,74" fill="#F4EFEA"/>

  <!-- Monograma BN + Barras de Grelha -->
  <text x="100" y="122" text-anchor="middle" fill="#F4EFEA" font-size="38" class="bn-s-mono">BN</text>
  <rect x="74" y="129" width="52" height="2.6" fill="#D4A373"/>
  <rect x="82" y="135.5" width="36" height="2.2" fill="#E85D04"/>
</svg>
