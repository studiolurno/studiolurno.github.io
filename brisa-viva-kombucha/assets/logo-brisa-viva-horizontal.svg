<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 120" width="430" height="120" role="img" aria-label="Logotipo Horizontal Brisa Viva Kombucha">
  <defs>
    <linearGradient id="bvhLeafMain" x1="15%" y1="95%" x2="85%" y2="5%">
      <stop offset="0%" stop-color="#022C22"/>
      <stop offset="48%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#65A30D"/>
    </linearGradient>
    <linearGradient id="bvhLeafSoft" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" stop-opacity="0.88"/>
      <stop offset="100%" stop-color="#A7F3D0" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="bvhWave" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="50%" stop-color="#65A30D"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <style>
      .bvh-serif { font-family: 'Fraunces', Georgia, serif; font-weight: 700; fill: #022C22; letter-spacing: -0.025em; }
      .bvh-italic { font-family: 'Fraunces', Georgia, serif; font-weight: 700; font-style: italic; fill: #059669; letter-spacing: -0.02em; }
      .bvh-sub { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-weight: 700; fill: #0F3D32; letter-spacing: 0.25em; }
    </style>
  </defs>

  <!-- Ícone Esquerdo -->
  <g transform="translate(56, 62) scale(0.92)">
    <circle cx="0" cy="2" r="48" fill="#A7F3D0" opacity="0.32"/>
    <path d="M -4,32 C -26,20 -40,-2 -31,-24 C -15,-22 0,-6 2,16 Z" fill="url(#bvhLeafSoft)"/>
    <path d="M -2,34 C -2,2 14,-26 40,-39 C 42,-10 28,20 2,34 Z" fill="url(#bvhLeafMain)"/>
    <path d="M 1,28 C 8,10 19,-10 33,-29" fill="none" stroke="#ECFDF5" stroke-width="2" stroke-linecap="round" opacity="0.85"/>
    <path d="M -40,36 C -18,26 8,46 42,31" fill="none" stroke="url(#bvhWave)" stroke-width="3.2" stroke-linecap="round"/>
    <circle cx="-11" cy="-34" r="4.8" fill="#E11D48"/>
    <circle cx="4" cy="-45" r="3.8" fill="#F59E0B"/>
    <circle cx="17" cy="-36" r="3.1" fill="#65A30D"/>
    <circle cx="-24" cy="-39" r="2.5" fill="#059669" opacity="0.8"/>
    <circle cx="-2" cy="-24" r="2.3" fill="#FFFFFF" stroke="#059669" stroke-width="1.3"/>
  </g>

  <!-- Tipografia Direita -->
  <text x="122" y="66" font-size="52">
    <tspan class="bvh-serif">Brisa </tspan><tspan class="bvh-italic">Viva</tspan>
  </text>
  <text x="125" y="94" font-size="13" class="bvh-sub">KOMBUCHA BOTÂNICA</text>
