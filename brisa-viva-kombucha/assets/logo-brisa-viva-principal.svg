<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 280" width="360" height="280" role="img" aria-label="Logotipo Principal Brisa Viva Kombucha">
  <defs>
    <linearGradient id="bvLeafMain" x1="15%" y1="95%" x2="85%" y2="5%">
      <stop offset="0%" stop-color="#022C22"/>
      <stop offset="48%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#65A30D"/>
    </linearGradient>
    <linearGradient id="bvLeafSoft" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" stop-opacity="0.88"/>
      <stop offset="100%" stop-color="#A7F3D0" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="bvWave" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="50%" stop-color="#65A30D"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <style>
      .bv-serif { font-family: 'Fraunces', Georgia, serif; font-weight: 700; fill: #022C22; letter-spacing: -0.025em; }
      .bv-italic { font-family: 'Fraunces', Georgia, serif; font-weight: 700; font-style: italic; fill: #059669; letter-spacing: -0.02em; }
      .bv-sub { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-weight: 700; fill: #0F3D32; letter-spacing: 0.28em; }
    </style>
  </defs>

  <!-- Símbolo Botânico Fluido + Micro-bolhas -->
  <g transform="translate(180, 74)">
    <!-- Halo translúcido sutil -->
    <circle cx="0" cy="4" r="50" fill="#A7F3D0" opacity="0.28"/>
    <!-- Folha secundária (brisa esquerda) -->
    <path d="M -4,34 C -28,22 -44,-2 -34,-26 C -16,-24 0,-6 2,18 Z" fill="url(#bvLeafSoft)"/>
    <!-- Folha principal fluida (crescimento orgânico) -->
    <path d="M -2,36 C -2,2 14,-28 42,-42 C 44,-12 30,22 2,36 Z" fill="url(#bvLeafMain)"/>
    <!-- Nervura luminosa na folha principal -->
    <path d="M 1,30 C 8,10 20,-12 35,-32" fill="none" stroke="#ECFDF5" stroke-width="2" stroke-linecap="round" opacity="0.85"/>
    <!-- Onda fluida de brisa na base -->
    <path d="M -42,38 C -20,27 8,49 44,33" fill="none" stroke="url(#bvWave)" stroke-width="3.2" stroke-linecap="round"/>
    <!-- 4 Micro-bolhas ascendentes de fermentação (ecoando os 4 sabores) -->
    <circle cx="-12" cy="-36" r="5" fill="#E11D48"/>
    <circle cx="4" cy="-48" r="4" fill="#F59E0B"/>
    <circle cx="18" cy="-39" r="3.2" fill="#65A30D"/>
    <circle cx="-26" cy="-42" r="2.6" fill="#059669" opacity="0.8"/>
    <circle cx="-2" cy="-26" r="2.4" fill="#FFFFFF" stroke="#059669" stroke-width="1.3"/>
  </g>

  <!-- Wordmark Editorial -->
  <text x="180" y="196" text-anchor="middle" font-size="56">
    <tspan class="bv-serif">Brisa </tspan><tspan class="bv-italic">Viva</tspan>
  </text>

  <!-- Linha divisória fina + Subtítulo -->
  <line x1="88" y1="214" x2="272" y2="214" stroke="#059669" stroke-width="1.2" opacity="0.45"/>
  <text x="180" y="242" text-anchor="middle" font-size="14" class="bv-sub">KOMBUCHA BOTÂNICA</text>
</svg>
